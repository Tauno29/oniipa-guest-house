<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Oipapa Guesthouse | Comfortable Accommodation in Namibia</title>
    <meta
      name="description"
      content="Oipapa Guesthouse offers clean, comfortable self-catering accommodation in Onhuno, helao nafidi, Namibia, with guest rooms, kitchen facilities, and direct booking enquiries." />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="author" content="Oipapa Guesthouse" />
    <link rel="canonical" href="https://oipapaguesthouse.netlify.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oipapa Guesthouse" />
    <meta property="og:title" content="Oipapa Guesthouse | Comfortable Accommodation in Namibia" />
    <meta
      property="og:description"
      content="Clean, comfortable self-catering accommodation in Onhuno, helao nafidi, Namibia." />
    <meta property="og:url" content="https://oipapaguesthouse.netlify.app/" />
    <meta property="og:image" content="https://oipapaguesthouse.netlify.app/assets/oipapa-hero.png" />
    <meta property="og:image:alt" content="Oipapa Guesthouse self-catering rooms and kitchen" />
    <meta property="og:locale" content="en_NA" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oipapa Guesthouse | Comfortable Accommodation in Namibia" />
    <meta
      name="twitter:description"
      content="Clean, comfortable self-catering accommodation in Onhuno, helao nafidi, Namibia." />
    <meta name="twitter:image" content="https://oipapaguesthouse.netlify.app/assets/oipapa-hero.png" />
    <meta name="twitter:image:alt" content="Oipapa Guesthouse self-catering rooms and kitchen" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "@id": "https://oipapaguesthouse.netlify.app/#lodging-business",
        "name": "Oipapa Guesthouse",
        "url": "https://oipapaguesthouse.netlify.app/",
        "description": "Clean, comfortable self-catering accommodation in Onhuno, helao nafidi, Namibia, with guest rooms, kitchen facilities, and direct booking enquiries.",
        "image": "https://oipapaguesthouse.netlify.app/assets/oipapa-hero.png",
        "telephone": "0813788797",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Onhuno, helao nafidi",
          "addressCountry": "Namibia"
        },
        "amenityFeature": [
          {
            "@type": "LocationFeatureSpecification",
            "name": "Self-catering kitchen",
            "value": true
          },
          {
            "@type": "LocationFeatureSpecification",
            "name": "Wi-Fi",
            "value": true
          }
        ]
      }
    </script>

    <!-- THIS IS THE START OF A COMMENT BLOCK, BLOCK TO BE DELETED: Google Fonts here, example:
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Oipapa Guesthouse</h1>
        <p>Oipapa Guesthouse provides clean, comfortable self-catering accommodation in Onhuno, helao nafidi, Namibia.</p>
        <p>Guests can enquire about rooms by calling 081 378 8797, emailing oipapa2016@gmail.com, or using the booking enquiry form on this page.</p>
      </main>
    </noscript>
    <!-- Netlify Forms detection shell; the interactive React form uses the same form name. -->
    <form name="room-booking" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="guests" />
      <input type="date" name="arrival" />
      <input type="date" name="departure" />
      <input type="text" name="room" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
